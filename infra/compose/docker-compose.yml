name: ai-parallel-web

services:
  api:
    build:
      context: ../..
      dockerfile: infra/containers/node-service.Dockerfile
      args:
        SERVICE_WORKSPACE: '@ai-parallel-web/api'
    env_file:
      - ../../config/environments/development.env.example
    environment:
      RELEASE_SHA: local-compose
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  fixture:
    build:
      context: ../..
      dockerfile: infra/containers/node-service.Dockerfile
      args:
        SERVICE_WORKSPACE: '@ai-parallel-web/fixture'
    environment:
      FIXTURE_PORT: 4300
    ports:
      - '4300:4300'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4300/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: parallelweb
      POSTGRES_PASSWORD: parallelweb
      POSTGRES_USER: parallelweb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parallelweb -d parallelweb']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
        mc mb --ignore-existing local/parallelweb-evidence

volumes:
  minio-data:
  postgres-data-v18:
  redis-data:
